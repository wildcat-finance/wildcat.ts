    liquidator
  }
}

query getCollateralContractEvents(
  $collateralContract: ID!
  $startEventIndex: Int = 0
  $endEventIndex: Int = 100000000
  $limit: Int = 10
  $depositRecordsFilter: SimpleCollateralContractDeposit_filter = { id_not: null }
  $includeDeposits: Boolean = true
  $reclaimRecordsFilter: SimpleCollateralContractReclaim_filter = { id_not: null }
  $includeReclaims: Boolean = true
  $liquidationRecordsFilter: SimpleCollateralContractLiquidation_filter = { id_not: null }
  $includeLiquidations: Boolean = true
  $fullResetRecordsFilter: SimpleCollateralContractFullReset_filter = { id_not: null }
  $includeFullResets: Boolean = true
  $liquidatedSharesResetRecordsFilter: SimpleCollateralContractLiquidatedSharesReset_filter = { id_not: null }
  $includeLiquidatedSharesResets: Boolean = true
) {
  simpleCollateralContract(id: $collateralContract) {
    deposits(
      where: {
        and: [
          $depositRecordsFilter
          { eventIndex_gte: $startEventIndex, eventIndex_lt: $endEventIndex }
        ]
      }
      orderBy: eventIndex
      orderDirection: desc
      first: $limit
    ) @include(if: $includeDeposits) {
      ...SimpleCollateralContractDepositData
    } 
    reclaims(
      where: {
        and: [
          $reclaimRecordsFilter
          { eventIndex_gte: $startEventIndex, eventIndex_lt: $endEventIndex }
        ]
      }
      orderBy: eventIndex
      orderDirection: desc
      first: $limit
    ) @include(if: $includeReclaims) {
      ...SimpleCollateralContractReclaimData
    }
    liquidations(
      where: {
        and: [
          $liquidationRecordsFilter
          { eventIndex_gte: $startEventIndex, eventIndex_lt: $endEventIndex }
        ]
      }
      orderBy: eventIndex
      orderDirection: desc
      first: $limit
    ) @include(if: $includeLiquidations) {
      ...SimpleCollateralContractLiquidationData
    }
    fullResets(
      where: {
        and: [
          $fullResetRecordsFilter
          { eventIndex_gte: $startEventIndex, eventIndex_lt: $endEventIndex }
        ]
      }
      orderBy: eventIndex
      orderDirection: desc
      first: $limit
    ) @include(if: $includeFullResets) {
      ...SimpleCollateralContractFullResetData
    }
    liquidatedSharesResets(
      where: {
        and: [
          $liquidatedSharesResetRecordsFilter
          { eventIndex_gte: $startEventIndex, eventIndex_lt: $endEventIndex }
        ]
      }
      orderBy: eventIndex
      orderDirection: desc
      first: $limit
    ) @include(if: $includeLiquidatedSharesResets) {
      ...SimpleCollateralContractLiquidatedSharesResetData
    }
  }
}

query getMarketChartsData(
  $market: ID!
  # withdrawal batches
  $numWithdrawalBatches: Int = 100
  $skipWithdrawalBatches: Int = 0
  $orderWithdrawalBatches: WithdrawalBatch_orderBy = expiry
  $directionWithdrawalBatches: OrderDirection = desc
  # daily stats
  $numDailyStats: Int = 100
  $skipDailyStats: Int = 0
  $orderDailyStats: MarketDailyStats_orderBy = startTimestamp
  $directionDailyStats: OrderDirection = desc
) {
  market(id: $market) {
    # Only expired withdrawal batches
    withdrawalBatches(
      where: { expiration_: { id_not: null } }
      first: $numWithdrawalBatches
      skip: $skipWithdrawalBatches
      orderBy: $orderWithdrawalBatches
      orderDirection: $directionWithdrawalBatches
    ) {
      expiry
      expiration {
        normalizedAmountPaid
        normalizedAmountOwed
      }
    }
    asset {
      decimals
      symbol
      name
    }
    dailyStats(
      first: $numDailyStats
      skip: $skipDailyStats
      orderBy: $orderDailyStats
      orderDirection: $directionDailyStats
    ) {
      timestamp: startTimestamp
      totalDeposited
      totalWithdrawalsRequested
      totalBorrowed
      totalRepaid
    }
  }
}
