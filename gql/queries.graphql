# import './fragments.graphql'

# -------------------------------------------------------------------------- #
#                                Lender Views                                #
# -------------------------------------------------------------------------- #

query getLenderAccountForMarket(
  $market: ID!
  $lender: Bytes!
  $numDeposits: Int = 200
  $skipDeposits: Int = 0
  $orderDeposits: Deposit_orderBy = blockTimestamp
  $directionDeposits: OrderDirection = desc
) {
  market(id: $market) {
    lenders(where: { address: $lender }) {
      ...AccountDataForLenderView
    }
  }
}

query getLenderAccountWithMarket(
  $market: ID!
  $lender: Bytes!
  $numDeposits: Int = 200
  $skipDeposits: Int = 0
  $orderDeposits: Deposit_orderBy = blockTimestamp
  $directionDeposits: OrderDirection = desc
  # borrowRecords
  $numBorrows: Int = 10
  $skipBorrows: Int = 0
  $orderBorrows: Borrow_orderBy = blockTimestamp
  $directionBorrows: OrderDirection = desc
  # repaymentRecords
  $numRepayments: Int = 10
  $skipRepayments: Int = 0
  $orderRepayments: DebtRepaid_orderBy = blockTimestamp
  $directionRepayments: OrderDirection = desc
) {
  market(id: $market) {
    lenders(where: { address: $lender }) {
      ...AccountDataForLenderView
    }
    ...MarketData
    borrowRecords(
      first: $numBorrows
      skip: $skipBorrows
      orderBy: $orderBorrows
      orderDirection: $directionBorrows
    ) {
      ...BorrowData
    }
    repaymentRecords(
      first: $numRepayments
      skip: $skipRepayments
      orderBy: $orderRepayments
      orderDirection: $directionRepayments
    ) {
      ...RepaymentData
    }
  }
}

# Check whether a borrower is registered and has any markets
query getBasicBorrowerData($borrower: Bytes!) {
  registeredBorrowers(where: { borrower: $borrower }, first: 1) {
    isRegistered
  }
  markets(where: { borrower: $borrower }, first: 1) {
    id
  }
}

# Get all markets, including lender account if lender is authorized
query getAllMarketsForLenderView(
  $lender: Bytes
  # markets - default order is newest first
  $marketFilter: Market_filter = { id_not: null }
  $numMarkets: Int = 1000
  $skipMarkets: Int = 0
  $orderMarkets: Market_orderBy = createdAt
  $directionMarkets: OrderDirection = desc
  # deposits
  $numDeposits: Int = 10
  $skipDeposits: Int = 0
  $orderDeposits: Deposit_orderBy = blockTimestamp
  $directionDeposits: OrderDirection = desc
  # borrowRecords
  $numBorrows: Int = 10
  $skipBorrows: Int = 0
  $orderBorrows: Borrow_orderBy = blockTimestamp
  $directionBorrows: OrderDirection = desc
  # repaymentRecords
  $numRepayments: Int = 10
  $skipRepayments: Int = 0
  $orderRepayments: DebtRepaid_orderBy = blockTimestamp
  $directionRepayments: OrderDirection = desc
) {
  markets(
    where: $marketFilter
    orderBy: $orderMarkets
    orderDirection: $directionMarkets
    first: $numMarkets
    skip: $skipMarkets
  ) {
    ...MarketData
    borrowRecords(
      first: $numBorrows
      skip: $skipBorrows
      orderBy: $orderBorrows
      orderDirection: $directionBorrows
    ) {
      ...BorrowData
    }
    repaymentRecords(
      first: $numRepayments
      skip: $skipRepayments
      orderBy: $orderRepayments
      orderDirection: $directionRepayments
    ) {
      ...RepaymentData
    }
    lenders(where: { address: $lender }, first: 1) {
      ...AccountDataForLenderView
    }
  }
  controllerAuthorizations: lenderAuthorizations(
    where: { and: [{ lender: $lender }, { authorized: true }] }
  ) {
    lender
    authorized
    controller {
      markets {
        id
      }
    }
  }
}

query getAllMarketsForLenderListView(
  $lender: Bytes
  # markets - default order is newest first
  $marketFilter: Market_filter = { id_not: null }
  $numMarkets: Int = 1000
  $skipMarkets: Int = 0
  $orderMarkets: Market_orderBy = createdAt
  $directionMarkets: OrderDirection = desc
) {
  markets(
    where: $marketFilter
    orderBy: $orderMarkets
    orderDirection: $directionMarkets
    first: $numMarkets
    skip: $skipMarkets
  ) {
    ...MarketListData
    lenders(where: { address: $lender }, first: 1) {
      ...AccountDataForLenderListView
    }
  }
  controllerAuthorizations: lenderAuthorizations(
    where: { and: [{ lender: $lender }, { authorized: true }] }
  ) {
    lender
    authorized
    controller {
      markets {
        id
      }
    }
  }
}

# Get only markets where lender is authorized or active, including lender account
query getAccountsWhereLenderAuthorizedOrActive(
  $lender: Bytes!
  $accountFilter: LenderAccount_filter = { address_not: null }
  # deposits
  $numDeposits: Int = 200
  $skipDeposits: Int = 0
  $orderDeposits: Deposit_orderBy = blockTimestamp
  $directionDeposits: OrderDirection = desc
  # borrowRecords
  $numBorrows: Int = 10
  $skipBorrows: Int = 0
  $orderBorrows: Borrow_orderBy = blockTimestamp
  $directionBorrows: OrderDirection = desc
  # repaymentRecords
  $numRepayments: Int = 10
  $skipRepayments: Int = 0
  $orderRepayments: DebtRepaid_orderBy = blockTimestamp
  $directionRepayments: OrderDirection = desc
) {
  lenderAccounts(
    where: {
      and: [
        $accountFilter
        { address: $lender }
        {
          or: [
            { role_in: [DepositAndWithdraw, WithdrawOnly] }
            { scaledBalance_gt: 0 }
            { controllerAuthorization_: { authorized: true } }
            { knownLenderStatus_: { id_not: null } }
            { hooksAccess_: { lastApprovalTimestamp_gt: 0 } }
            { totalDeposited_gt: 0 }
          ]
        }
      ]
    }
  ) {
    ...AccountDataForLenderView
    market {
      ...MarketData
      borrowRecords(
        first: $numBorrows
        skip: $skipBorrows
        orderBy: $orderBorrows
        orderDirection: $directionBorrows
      ) {
        ...BorrowData
      }
      repaymentRecords(
        first: $numRepayments
        skip: $skipRepayments
        orderBy: $orderRepayments
        orderDirection: $directionRepayments
      ) {
        ...RepaymentData
      }
    }
  }
  controllerAuthorizations: lenderAuthorizations(
    where: { and: [{ lender: $lender }, { authorized: true }] }
  ) {
    lender
    authorized
    controller {
      markets {
        ...MarketData
        borrowRecords(
          first: $numBorrows
          skip: $skipBorrows
          orderBy: $orderBorrows
          orderDirection: $directionBorrows
        ) {
          ...BorrowData
        }
        repaymentRecords(
          first: $numRepayments
          skip: $skipRepayments
          orderBy: $orderRepayments
          orderDirection: $directionRepayments
        ) {
          ...RepaymentData
        }
      }
    }
  }
}

query getLenderWithdrawalsForMarket(
  $market: ID!
  $lender: Bytes!
  $numWithdrawals: Int = 200
  $skipWithdrawals: Int = 0
) {
  market(id: $market) {
    lenders(where: { address: $lender }) {
      incompleteWithdrawals: withdrawals(
        first: $numWithdrawals
        skip: $skipWithdrawals
        where: { isCompleted: false }
      ) {
        ...LenderWithdrawalPropertiesWithEvents
      }

      completeWithdrawals: withdrawals(
        first: $numWithdrawals
        skip: $skipWithdrawals
        where: { isCompleted: true }
      ) {
        ...LenderWithdrawalPropertiesWithEvents
      }
    }
  }
}

query getLenderAuthorizationByMarket($market: ID!, $lender: Bytes!) {
  market(id: $market) {
    controller {
      authorizedLenders(where: { lender: $lender }) {
        lender
        authorized
      }
    }
  }
}

# Get market address and lender interaction logs for markets
# where lender is authorized on controller, has a role or has
# a balance.
query getMarketsAndLogsWhereLenderAuthorizedOrActive(
  $lender: Bytes!
  $minimumBalance: BigInt = 1
  $accountFilter: LenderAccount_filter = { address_not: null }
  $numAccounts: Int = 1000
  $skipAccounts: Int = 0
  $orderAccounts: LenderAccount_orderBy = lastUpdatedTimestamp
  $directionAccounts: OrderDirection = desc
  # deposits
  $numDeposits: Int = 200
  $skipDeposits: Int = 0
  $orderDeposits: Deposit_orderBy = blockTimestamp
  $directionDeposits: OrderDirection = desc
  # withdrawals
  $numWithdrawals: Int = 200
  $skipWithdrawals: Int = 0 # $orderWithdrawals: LenderWithdrawalStatus_orderBy = batch__expiry # $directionWithdrawals: OrderDirection = desc
) {
  lenderAccounts(
    where: {
      and: [
        {
          address: $lender
          or: [
            { role_in: [DepositAndWithdraw, WithdrawOnly] }
            { scaledBalance_gt: $minimumBalance }
            { controllerAuthorization_: { authorized: true } }
          ]
        }
        $accountFilter
      ]
    }
    first: $numAccounts
    skip: $skipAccounts
    orderBy: $orderAccounts
    orderDirection: $directionAccounts
  ) {
    market {
      id
    }
    scaledBalance
    role
    totalDeposited
    lastScaleFactor
    totalInterestEarned
    controllerAuthorization {
      authorized
    }
    withdrawals(
      first: $numWithdrawals
      skip: $skipWithdrawals
      where: { isCompleted: false } # orderBy: $orderWithdrawals # orderDirection: $directionWithdrawals
    ) {
      ...LenderWithdrawalProperties

      batch {
        ...WithdrawalBatchProperties
      }
      requests {
        ...WithdrawalRequestProperties
      }
      executions {
        ...WithdrawalExecutionProperties
      }
    }

    deposits(
      first: $numDeposits
      skip: $skipDeposits
      orderBy: $orderDeposits
      orderDirection: $directionDeposits
    ) {
      ...DepositData
    }
  }
}

query getAllHooksTemplates($borrower: Bytes, $includeBorrower: Boolean!) {
  hooksTemplateRegistrations {
    ...HooksTemplateRegistrationData
  }
  registeredBorrowers(where: { borrower: $borrower }, first: 1) @include(if: $includeBorrower) {
    isRegistered
  }
}

query getHooksInstancesForBorrower($borrower: Bytes!) {
  hooksInstances(where: { borrower: $borrower }) {
    ...HooksInstanceData
  }
}

query getAllHooksDataForBorrower($borrower: Bytes!) {
  hooksTemplateRegistrations {
    ...HooksTemplateRegistrationData
  }
  hooksInstances(where: { borrower: $borrower }) {
    ...HooksInstanceData
  }
  registeredBorrowers(where: { borrower: $borrower }, first: 1) {
    isRegistered
  }
  controllers(where: { borrower: $borrower }, first: 1) {
    ...MinimalControllerData
  }
}

query getIndexerDeployment {
  indexerDeployments(first: 1) {
    id
    chainId
    network
    graphNetwork
    schemaRelease
    configDigest
    archController
    sanctionsSentinel
    analyticsEnabled
    collateralEnabled
    wrappersEnabled
    pricingMode
    firstObservedBlock
    firstObservedTimestamp
    firstObservedTransaction
    firstObservedLogIndex
  }
}

query getHooksFactories {
  hooksFactories {
    ...HooksFactoryData
  }
}

