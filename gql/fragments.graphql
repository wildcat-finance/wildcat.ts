fragment HooksConfigDataForMarket on HooksConfig {
  id
  # Exclude hooks, market
  useOnDeposit
  useOnQueueWithdrawal
  useOnExecuteWithdrawal
  useOnTransfer
  useOnBorrow
  useOnRepay
  useOnCloseMarket
  useOnNukeFromOrbit
  useOnSetMaxTotalSupply
  useOnSetAnnualInterestAndReserveRatioBips
  useOnSetProtocolFeeBips

  # Common config values
  depositRequiresAccess
  transferRequiresAccess
  transfersDisabled
  minimumDeposit
  allowForceBuyBacks

  # FixedTermHooks config values
  queueWithdrawalRequiresAccess
  fixedTermEndTime
  allowClosureBeforeTerm
  allowTermReduction

  # PeriodicTermHooks config values
  firstWithdrawalWindowStart
  periodDuration
  withdrawalWindowDuration
  periodicTermClosed
  pendingAprChangeAnnualInterestBips
  pendingAprChangeProposalTimestamp
  pendingAprChangeResponseWindowStart
  pendingAprChangeResponseWindowEnd
}

