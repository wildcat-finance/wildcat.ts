fragment MarketRecords on Market {
  depositRecords(
    first: $numDeposits
    skip: $skipDeposits
    orderBy: $orderDeposits
    orderDirection: $directionDeposits
  ) {
    ...DepositData
  }
  borrowRecords(
    first: $numBorrows
    skip: $skipBorrows
    orderBy: $orderBorrows
    orderDirection: $directionBorrows
  ) {
    ...BorrowData
  }
  feeCollectionRecords(
    first: $numFeeCollections
    skip: $skipFeeCollections
    orderBy: $orderFeeCollections
    orderDirection: $directionFeeCollections
  ) {
    ...FeesCollectedData
  }
  repaymentRecords(
    first: $numRepayments
    skip: $skipRepayments
    orderBy: $orderRepayments
    orderDirection: $directionRepayments
  ) {
    ...RepaymentData
  }
  periodicTermUpdatedRecords {
    ...PeriodicTermUpdatedData
  }
  periodicTermClosedRecord {
    ...PeriodicTermClosedData
  }
  annualInterestBipsReductionProposalRecords {
    ...AnnualInterestBipsReductionProposedData
  }
}

