# import './fragments.graphql'

fragment TokenData on Token {
  id
  address
  name
  symbol
  decimals
  isMock
}

fragment RoleProviderData on RoleProvider {
  id
  providerAddress
  timeToLive
  isPullProvider
  pullProviderIndex
  isPushProvider
  pushProviderIndex
  isApproved
}

fragment LenderHooksAccessData on LenderHooksAccess {
  id
  lender
  isBlockedFromDeposits
  lastProvider {
    ...RoleProviderData
  }
  canRefresh
  lastApprovalTimestamp
  addedTimestamp
}

fragment LenderHooksAccessWithKnownMarkets on LenderHooksAccess {
  ...LenderHooksAccessData
  hooks {
    id
  }
  knownLenderStatuses(first: 1000) {
    market {
      id
    }
  }
}

# ========================================================================== #
#                                Lender Views                                #
# ========================================================================== #

fragment AccountDataForLenderView on LenderAccount {
  ...LenderProperties

  controllerAuthorization {
    authorized
  }

  hooksAccess {
    ...LenderHooksAccessData
  }

  knownLenderStatus {
    id
  }

  deposits(
    first: $numDeposits
    skip: $skipDeposits
    orderBy: $orderDeposits
    orderDirection: $directionDeposits
  ) {
    ...DepositData
  }
}

fragment AccountDataForLenderCatalogue on LenderAccount {
  ...LenderProperties

  controllerAuthorization {
    authorized
  }

  hooksAccess {
    ...LenderHooksAccessData
  }

  knownLenderStatus {
    id
  }
}

# Lender data with:
# address
# balance
# time added
# access level & authorization source (if any)
fragment BasicLenderData on LenderAccount {
  id
  address

  scaledBalance
  addedTimestamp

  role
  controllerAuthorization {
    authorized
    addedTimestamp
  }
  hooksAccess {
    ...LenderHooksAccessData
  }
  knownLenderStatus {
    id
  }
}

fragment LenderProperties on LenderAccount {
  id
  address
  scaledBalance
  role
  totalDeposited
  lastScaleFactor
  lastUpdatedTimestamp
  totalInterestEarned
  numPendingWithdrawalBatches
}

fragment AllAuthorizedLendersView on LenderAuthorization {
  lender
  authorized
  changes(first: 1, orderBy: blockTimestamp, orderDirection: desc) {
    blockTimestamp
  }
}

fragment MinimalControllerData on Controller {
  id
  borrower
  numMarkets
  controllerFactory {
    id
    constraints {
      ...ParameterConstraintsData
    }
    feeRecipient
    protocolFeeBips
    originationFeeAsset {
      ...TokenData
    }
    originationFeeAmount
  }
  archController {
    id
  }
  isRegistered
}

# ============================================================================ #
#                                Borrower Views                                #
# ============================================================================ #

fragment MarketData on Market {
  id
  version

  # ================================= Config ================================= #
  isRegistered
  isClosed
  controller {
    id
  }
  borrower
  sentinel
  feeRecipient
  name
  symbol
  decimals
  protocolFeeBips
  delinquencyGracePeriod
  delinquencyFeeBips
  withdrawalBatchDuration
  numCollateralContracts

  _asset: asset {
    ...TokenData
  }

  hooksConfig {
    ...HooksConfigDataForMarket
  }
  hooks {
    ...HooksInstanceData
  }

  # ================================== State ================================= #
  maxTotalSupply
  totalAssets
  pendingProtocolFees
  normalizedUnclaimedWithdrawals
  scaledTotalSupply
  scaledPendingWithdrawals
  pendingWithdrawalExpiry
  isDelinquent
  timeDelinquent
  annualInterestBips
  reserveRatioBips
  scaleFactor
  lastInterestAccruedTimestamp
  originalAnnualInterestBips
  originalReserveRatioBips
  temporaryReserveRatioExpiry
  temporaryReserveRatioActive

  # Stored unpaid withdrawal batch FIFO: expired but not fully paid.
  unpaidWithdrawalBatches: withdrawalBatches(
    where: { isExpired: true, isClosed: false }
    orderBy: expiry
    orderDirection: asc
  ) {
    expiry
  }

  # ================================ Metadata ================================ #
  totalBorrowed
  totalRepaid
  totalBaseInterestAccrued
  totalDelinquencyFeesAccrued
  totalProtocolFeesAccrued
  totalDeposited
  eventIndex

  deployedEvent {
    ...MarketDeployedEvent
  }
}

fragment AprConstraints on ParameterConstraints {
  minimumAnnualInterestBips
  maximumAnnualInterestBips
}

fragment ParameterConstraintsData on ParameterConstraints {
  minimumDelinquencyGracePeriod
  maximumDelinquencyGracePeriod
  minimumReserveRatioBips
  maximumReserveRatioBips
  minimumDelinquencyFeeBips
  maximumDelinquencyFeeBips
  minimumWithdrawalBatchDuration
  maximumWithdrawalBatchDuration
  minimumAnnualInterestBips
  maximumAnnualInterestBips
}

