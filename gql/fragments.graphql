# import './fragments.graphql'

fragment TokenData on Token {
  id
  address
  name
  symbol
  decimals
  isMock
}

fragment RoleProviderData on RoleProvider {
  id
  providerAddress
  timeToLive
  isPullProvider
  pullProviderIndex
  isPushProvider
  pushProviderIndex
  isApproved
}

fragment LenderHooksAccessData on LenderHooksAccess {
  id
  lender
  isBlockedFromDeposits
  lastProvider {
    ...RoleProviderData
  }
  canRefresh
  lastApprovalTimestamp
  addedTimestamp
}

# ========================================================================== #
#                                Lender Views                                #
# ========================================================================== #

fragment AccountDataForLenderView on LenderAccount {
  ...LenderProperties

  controllerAuthorization {
    authorized
  }

  hooksAccess {
    ...LenderHooksAccessData
  }

  knownLenderStatus {
    id
  }

  deposits(
    first: $numDeposits
    skip: $skipDeposits
    orderBy: $orderDeposits
    orderDirection: $directionDeposits
  ) {
    ...DepositData
  }
}

fragment AccountDataForLenderListView on LenderAccount {
  ...LenderProperties

  controllerAuthorization {
    authorized
  }

  hooksAccess {
    ...LenderHooksAccessData
  }

  knownLenderStatus {
    id
  }
}

# Lender data with:
# address
# balance
# time added
# access level & authorization source (if any)
fragment BasicLenderData on LenderAccount {
  id
  address

  scaledBalance
  addedTimestamp

  role
  controllerAuthorization {
    authorized
    addedTimestamp
  }
  hooksAccess {
    ...LenderHooksAccessData
  }
  knownLenderStatus {
    id
  }
}

fragment LenderProperties on LenderAccount {
  id
  address
  scaledBalance
  role
  totalDeposited
  lastScaleFactor
  lastUpdatedTimestamp
  totalInterestEarned
  numPendingWithdrawalBatches
  snapshot {
    ...LenderAccountSnapshotData
  }
}

fragment LenderAccountSnapshotData on LenderAccountSnapshot {
  source
  scaledBalance
  role
  totalDeposited
  lastScaleFactor
  lastUpdatedTimestamp
  lastUpdatedBlockNumber
  totalInterestEarned
  numPendingWithdrawalBatches
  updatedAtBlock
  updatedAtTimestamp
  updatedAtTransaction
  updatedAtLogIndex
}

fragment AllAuthorizedLendersView on LenderAuthorization {
  lender
  authorized
  changes(first: 1, orderBy: blockTimestamp, orderDirection: desc) {
    blockTimestamp
  }
}

fragment MinimalControllerData on Controller {
  id
  borrower
  numMarkets
  controllerFactory {
    id
    constraints {
      ...ParameterConstraintsData
    }
    feeRecipient
    protocolFeeBips
    originationFeeAsset {
      ...TokenData
    }
    originationFeeAmount
  }
  archController {
    id
  }
  isRegistered
}

# ============================================================================ #
#                                Borrower Views                                #
# ============================================================================ #

fragment MarketData on Market {
  id
  address
  version
  marketKind
  originKind
  generation
  abiFamily
  archController {
    id
  }
  hooksFactory {
    ...HooksFactoryData
  }

  # ================================= Config ================================= #
  isRegistered
  isClosed
  controller {
    id
  }
  borrower
  sentinel
  feeRecipient
  name
  symbol
  decimals
  protocolFeeBips
  delinquencyGracePeriod
  delinquencyFeeBips
  withdrawalBatchDuration
  numCollateralContracts

  _asset: asset {
    ...TokenData
  }

  hooksConfig {
    ...HooksConfigDataForMarket
  }
  hooks {
    ...HooksInstanceData
  }

  # ================================== State ================================= #
  maxTotalSupply
  pendingProtocolFees
  normalizedUnclaimedWithdrawals
  scaledTotalSupply
  scaledPendingWithdrawals
  pendingWithdrawalExpiry
  isDelinquent
  timeDelinquent
  annualInterestBips
  commitmentFeeBips
  reserveRatioBips
  drawnAmount
  scaleFactor
  lastInterestAccruedTimestamp
  originalAnnualInterestBips
  originalReserveRatioBips
  temporaryReserveRatioExpiry
  temporaryReserveRatioActive

  # ================================ Metadata ================================ #
  totalBorrowed
  totalRepaid
  totalBaseInterestAccrued
  totalDelinquencyFeesAccrued
  totalProtocolFeesAccrued
  totalDeposited
  eventIndex

  deployedEvent {
    ...MarketDeployedEvent
  }
  createdAtBlock
  createdAtTimestamp
  createdAtTransaction
  createdAtLogIndex
  snapshot {
    ...MarketSnapshotData
  }
}

fragment ParameterConstraintsData on ParameterConstraints {
  minimumDelinquencyGracePeriod
  maximumDelinquencyGracePeriod
  minimumReserveRatioBips
  maximumReserveRatioBips
  minimumDelinquencyFeeBips
  maximumDelinquencyFeeBips
  minimumWithdrawalBatchDuration
  maximumWithdrawalBatchDuration
  minimumAnnualInterestBips
  maximumAnnualInterestBips
}

