schema: 'https://subgraph.satsuma-prod.com/db4945988e6f/dillons-team--345508/sepolia/version/v2.0.19/api'
overwrite: true
documents:
  - './gql/queries.graphql'
  - './gql/fragments.graphql'
generates:
  ./src/gql/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      dedupeFragments: true
      avoidOptionals: false
      withResultType: true
      withHooks: false
      typesPrefix: 'Subgraph'
      scalars:
        BigInt:
          input: 'string | number | bigint'
          output: 'string'
        Bytes:
          input: 'string'
          output: 'string'
        ID:
          input: 'string'
          output: 'string'