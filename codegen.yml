schema: 'https://api.goldsky.com/api/public/project_cmheai1ym00jyx7p27qn46qtm/subgraphs/sepolia/v2.0.31/gn'
overwrite: true
documents:
  - './gql/queries.graphql'
  - './gql/fragments.graphql'
generates:
  ./src/gql/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      dedupeFragments: true
      avoidOptionals: false
      withResultType: true
      withHooks: false
      typesPrefix: 'Subgraph'
      scalars:
        BigInt:
          input: 'string | number | bigint'
          output: 'string'
        Bytes:
          input: 'string'
          output: 'string'
        ID:
          input: 'string'
          output: 'string'
